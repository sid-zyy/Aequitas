[project]
name = "minerva"
version = "0.1.0"
description = "Open-source live video event summarization, classification and conversational querying"
requires-python = ">=3.11"
dependencies = [
    "ultralytics>=8.3",
    "supervision>=0.25,<0.31",  # sv.ByteTrack is removed in 0.31
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6",
    "ollama>=0.4",
    "gradio>=5",
    "psutil>=5.9",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
nvidia = ["nvidia-ml-py>=12"]

[project.scripts]
minerva = "minerva.cli:main"

[tool.setuptools.packages.find]
include = ["minerva*"]

[tool.setuptools.package-data]
minerva = ["store/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
