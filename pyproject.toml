[project]
name = "aequitas"
version = "0.1.0"
description = "Open-source live video event summarization, classification and conversational querying"
requires-python = ">=3.11"
dependencies = [
    "ultralytics>=8.3",
    "supervision>=0.25,<0.31",  # only sv.Detections is used now (tracking is Ultralytics); lift the cap once 0.31 is tested
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6",
    "ollama>=0.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "onnxruntime>=1.17",
    "psutil>=5.9",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
nvidia = ["nvidia-ml-py>=12"]
# AI-likelihood frame detector for citizen videos (aequitas/authenticity.py), c2pa content credentials,
# and the SigLIP scene gate (aequitas/understand/gate.py; its tokenizer needs sentencepiece)
detector = ["transformers>=4.40", "pillow>=10", "c2pa-python>=0.6", "sentencepiece>=0.2"]
# RF-DETR person/bag detector for triggered mode (detector.family: rfdetr; docs/DETECTION.md)
rfdetr = ["rfdetr>=1.11"]

[project.scripts]
aequitas = "aequitas.cli:main"

[tool.setuptools.packages.find]
include = ["aequitas*"]

[tool.setuptools.package-data]
aequitas = ["store/schema.sql", "web/static/*", "web/frontend_dist/*", "web/frontend_dist/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
