# Bengaluru localities and their camera points for the Live CCTV dashboard.
# DEMO: real CCTV is not available, so each camera plays free-licence street footage from data/footage/
# (see data/footage/SOURCES.md for where each clip came from). Incident cameras play staged clips (an arrest,
# fires, a crashed car, graffiti vandalism) that were checked to be caught by the model (4 s windows, Gemma 4 E2B): only clips the
# pipeline actually labels correctly are used. Camera names are real landmarks so the
# demo reads naturally; the footage is not from those places.
# One camera per locality plays one of the six faculty sample clips (real CCTV fights, w001 a weapon; data/footage/
# faculty/). Gemma alone misses them; the violence clip model catches them (results/violence_clip/README.md).
localities:
  - id: koramangala
    name: Koramangala
    cameras:
      - {id: kor-sony-world, name: Sony World Junction, file: data/footage/koramangala/sony-world.mp4}
      - {id: kor-forum, name: Forum Mall, Hosur Road, file: data/footage/koramangala/forum.mp4}
      - {id: kor-80ft, name: 80 Feet Road, file: data/footage/koramangala/80ft-road.mp4}
      - {id: kor-jyoti-nivas, name: Jyoti Nivas College Road, file: data/footage/incidents/accident-wreck.mp4}
      - {id: kor-5th-block, name: 5th Block Cafe Terrace, file: data/footage/faculty/v001.mp4}
  - id: indiranagar
    name: Indiranagar
    cameras:
      - {id: ind-100ft, name: 100 Feet Road, file: data/footage/indiranagar/100ft-road.mp4}
      - {id: ind-cmh, name: CMH Road Metro, file: data/footage/indiranagar/cmh-metro.mp4}
      - {id: ind-12main, name: 12th Main, file: data/footage/indiranagar/12th-main.mp4}
      - {id: ind-double-road, name: Double Road Restaurant, file: data/footage/faculty/v011.mp4}
  - id: whitefield
    name: Whitefield
    cameras:
      - {id: wf-itpl, name: ITPL Main Road, file: data/footage/whitefield/itpl.mp4}
      - {id: wf-phoenix, name: Phoenix Marketcity, file: data/footage/whitefield/phoenix.mp4}
      - {id: wf-hope-farm, name: Hope Farm Junction, file: data/footage/whitefield/hope-farm.mp4}
      - {id: wf-kundalahalli, name: Whitefield Industrial Area, file: data/footage/incidents/fire-building.mp4}
      - {id: wf-epip, name: EPIP Zone Hostel Corridor, file: data/footage/faculty/v026.mp4}
  - id: mg-road
    name: MG Road
    cameras:
      - {id: mg-kumble, name: Anil Kumble Circle, file: data/footage/mg-road/kumble-circle.mp4}
      - {id: mg-brigade, name: Brigade Road Junction, file: data/footage/mg-road/brigade-road.mp4}
      - {id: mg-trinity, name: Trinity Metro, file: data/footage/mg-road/trinity.mp4}
      - {id: mg-church-st, name: Church Street, file: data/footage/incidents/arrest-4.mp4}
      - {id: mg-mayo-hall, name: Mayo Hall Court Complex, file: data/footage/faculty/w001.mp4}
  - id: majestic
    name: Majestic
    cameras:
      - {id: maj-ksr, name: KSR Railway Station, file: data/footage/majestic/ksr-station.mp4}
      - {id: maj-kbs, name: Kempegowda Bus Station, file: data/footage/majestic/kbs.mp4}
      - {id: maj-gandhinagar, name: Gandhi Nagar, file: data/footage/majestic/gandhi-nagar.mp4}
      - {id: maj-platform-rd, name: Platform Road Parking Complex, file: data/footage/incidents/vandalism.mp4}
      - {id: maj-ksr-security, name: KSR Station Security Check, file: data/footage/faculty/v006.mp4}
  - id: electronic-city
    name: Electronic City
    cameras:
      - {id: ec-flyover, name: Electronic City Flyover, file: data/footage/electronic-city/flyover.mp4}
      - {id: ec-phase1, name: Phase 1 Main Gate, file: data/footage/electronic-city/phase1.mp4}
      - {id: ec-neeladri, name: Neeladri Road, file: data/footage/incidents/fire-rescue.mp4}
      - {id: ec-hosur-service, name: Hosur Road Service Lane, file: data/footage/faculty/v003.mp4}
  # Live demo: the laptop's own webcam. Close-range view (gestures, objects held) and 2 s windows so a
  # judge's action shows up quickly. Not a real Bengaluru camera.
  - id: live-demo
    name: "Live demo: laptop webcam"
    cameras:
      # source "browser": the page asks for camera permission and sends frames; "0" = the server opens it
      - {id: demo-webcam, name: Laptop webcam, source: browser, view: close, window_s: 2.0}
      # A phone running the IP Webcam app (Android), mounted high like CCTV; the address changes with the network
      - {id: demo-phone, name: Phone camera, source: "http://10.158.149.251:8080/video", window_s: 2.0}
