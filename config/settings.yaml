# Aequitas runtime settings. Every key is optional; defaults live in aequitas/config.py.

device: auto            # auto picks cuda:0 / mps if present, else cpu
sample_fps: 4
ring_buffer_s: 12
data_dir: data

analysis:
  mode: triggered       # triggered = YOLO + rules gate the VLM; periodic = no YOLO, VLM reviews every window
  window_s: 4           # periodic mode only
  confirm_votes: 2      # periodic mode: consecutive agreeing windows needed for 'confirmed'
  # Previous-window context in the label step: helped gemma4:e2b (22 -> 25 of 39 incident windows) but hurts
  # qwen3-vl:2b-instruct (fire 6/10 -> 1/10, 33 -> 29 of 39 flagged, false alarms 2 -> 4 of 33) on the 72 saved windows.
  label_context: false
  # Coarse stage: skip Gemma on windows that clearly look normal (results/improvements/README.md).
  # Downloads google/siglip-base-patch16-224 (~0.8 GB) on first start; null = off.
  gate_model: google/siglip-base-patch16-224

models:                 # trained on Kaggle (see kaggle/README.md); leave null until downloaded
  violence_dir: models/violence_clip   # trained on Kaggle (SCVD + RLVS + RWF-2000), results/violence_clip/
  hazard_dir: null      # e.g. models/hazard_detector

detector:
  family: rfdetr        # needs pip install -e .[rfdetr], else falls back to YOLO (weights below); 'yolo' = YOLO11n, ~15 ms faster per frame but far worse on small/fighting people (docs/DETECTION.md)
  rfdetr_size: small
  weights: yolo11n.pt
  pose_weights: yolo11n-pose.pt
  backend: torch        # 'openvino' is usually 2-3x faster on Intel CPUs/iGPUs
  imgsz: 640
  conf: 0.25
  min_person_conf: 0.4
  min_person_height_px: 40

tracker:
  lost_track_buffer: 60   # frames (15 s at 4 fps) so short occlusions keep the same ID

vlm:
  backend: ollama         # ollama | openai (any local OpenAI-compatible server: llama.cpp, vLLM, LM Studio)
  host: http://127.0.0.1:11434
  model: qwen3-vl:2b-instruct  # owner, 2026-10-17: Qwen over gemma4:e2b (results/model_compare_small/README.md); 4-bit over 8-bit/16-bit (results/qwen/README.md)
  think: false
  repeat_penalty: 1.1     # stops Qwen repeating a sentence to the token cap (chat: 3/6 -> 0/6 answers; results/qwen/README.md)
  num_ctx: 4096
  draft_num_predict: null  # MTP drafter tokens per step; only gemma4 ships a drafter in Ollama (3: window 1.28 -> 1.16 s, chat 0.58 -> 0.45 s, docs/SPECULATIVE.md). Qwen3-VL has none
  timeout_s: 300          # CPU-only machines can take a minute or more per event
  tile_px: 448
  max_queue_per_camera: 8

chat:
  # Any key left null reuses the VLM endpoint (one heavy model at a time).
  # Example for a separate text model: backend: openai, host: http://127.0.0.1:8080, model: llama-3.2-3b
  backend: null
  host: null
  model: null
  summarize: true         # short LLM summary that may only cite retrieved event IDs
  timezone: null          # e.g. Asia/Kolkata; null = system local time

triggers:
  cooldown_s: 30
  person_down:
    sustain_s: 3
  fighting:
    motion_ratio: 3.0
    sustain_s: 1.5
  tailgating:
    max_gap_s: 2.0
  crowd:
    sustain_s: 10
  loitering:
    min_dwell_s: 60
  abandoned_object:
    unattended_s: 30
