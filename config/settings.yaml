# Minerva runtime settings. Every key is optional; defaults live in minerva/config.py.

device: auto            # auto picks cuda:0 / mps if present, else cpu
sample_fps: 4
ring_buffer_s: 12
data_dir: data

detector:
  weights: yolo11n.pt
  pose_weights: yolo11n-pose.pt
  backend: torch        # 'openvino' is usually 2-3x faster on Intel CPUs/iGPUs
  imgsz: 640
  conf: 0.25
  min_person_conf: 0.4
  min_person_height_px: 40

tracker:
  lost_track_buffer: 60   # frames (15 s at 4 fps) so short occlusions keep the same ID

vlm:
  host: http://127.0.0.1:11434
  model: qwen2.5vl:3b
  num_ctx: 4096
  timeout_s: 300          # CPU-only machines can take a minute or more per event
  tile_px: 448
  max_queue_per_camera: 8

chat:
  model: null             # null = reuse the VLM (one heavy model at a time)
  timezone: null          # e.g. Asia/Kolkata; null = system local time

triggers:
  cooldown_s: 30
  person_down:
    sustain_s: 3
  fighting:
    motion_ratio: 3.0
    sustain_s: 1.5
  tailgating:
    max_gap_s: 2.0
  crowd:
    sustain_s: 10
  loitering:
    min_dwell_s: 60
  abandoned_object:
    unattended_s: 30
